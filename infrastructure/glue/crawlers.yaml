# AWS Glue Crawler Configuration
# Creates crawler to auto-discover schema from S3 parquet files

Name: capstone-imaging-crawler
Description: Crawls capstone data lake for imaging tables
Role: AWSGlueServiceRole-capstone
DatabaseName: capstone_imaging
TablePrefix: ""

Targets:
  S3Targets:
    - Path: s3://capstone-imaging-bucket/datalake/bronze/imaging/
      Exclusions:
        - "**/_temporary/**"
        - "**/_SUCCESS"
        - "**/.DS_Store"
    - Path: s3://capstone-imaging-bucket/datalake/silver/imaging/
      Exclusions:
        - "**/_temporary/**"
        - "**/_SUCCESS"

Schedule:
  # Run daily at 2 AM UTC
  ScheduleExpression: "cron(0 2 * * ? *)"

SchemaChangePolicy:
  UpdateBehavior: UPDATE_IN_DATABASE
  DeleteBehavior: LOG

Configuration:
  Version: 1.0
  CrawlerOutput:
    Partitions:
      AddOrUpdateBehavior: InheritFromTable
  Grouping:
    TableGroupingPolicy: CombineCompatibleSchemas

Tags:
  Project: wgu-capstone
  Environment: production
  DataClassification: de-identified-phi
  ManagedBy: terraform

---

# Create crawler with AWS CLI:
# aws glue create-crawler --cli-input-yaml file://infrastructure/glue/crawlers.yaml

# Start crawler manually:
# aws glue start-crawler --name capstone-imaging-crawler

# Check crawler status:
# aws glue get-crawler --name capstone-imaging-crawler
