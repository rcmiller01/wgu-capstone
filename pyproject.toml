[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "health-data-lake"
version = "1.0.0"
description = "Synthetic Health Data Processing Pipeline Performance Analysis"
requires-python = ">=3.11,<3.13"
# Dependencies are managed in requirements.txt for reproducibility

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data/", "models/", "reports/", "docs/"]

[tool.ruff.lint]
select = ["E","F","I","UP","B","S","W","C90"]
ignore = ["E203"]

# Fix unsafe fixes in CI (sort imports, remove unused imports)
fixable = ["I", "F401"]
unfixable = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = false  # Permissive for grading, consider enabling for production
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = true
